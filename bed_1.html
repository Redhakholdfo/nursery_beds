<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bed Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1a3a2a; --forest-mid: #2d5c42; --forest-light: #4a8c64;
    --sage: #7ab896; --cream: #f5f0e8; --cream-dark: #ede5d4;
    --gold: #c8a84b; --gold-light: #e8c96a;
    --text-dark: #1a2418; --text-mid: #3d5248; --text-light: #6b8c7a;
    --white: #ffffff; --shadow: 0 4px 24px rgba(26,58,42,0.13); --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--forest); color: var(--text-dark); min-height: 100vh; }
  body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(ellipse at 20% 0%, rgba(74,140,100,0.18) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(200,168,75,0.1) 0%, transparent 50%); pointer-events: none; z-index: 0; }
  .page-wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 0 0 48px; }

  .header { background: linear-gradient(160deg, var(--forest-mid) 0%, var(--forest) 100%); padding: 32px 24px 28px; border-bottom: 2px solid rgba(200,168,75,0.3); position: relative; overflow: hidden; }
  .header::after { content: '🌿'; position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 52px; opacity: 0.18; }
  .header-label { font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--sage); margin-bottom: 8px; }
  .header-bed-id { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: var(--white); line-height: 1.1; }
  .header-nursery { margin-top: 6px; font-size: 13px; color: var(--sage); }
  .header-meta { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .header-badge { background: rgba(200,168,75,0.18); border: 1px solid rgba(200,168,75,0.35); color: var(--gold-light); font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }

  .updated-bar { background: rgba(200,168,75,0.12); border-bottom: 1px solid rgba(200,168,75,0.2); padding: 8px 24px; font-size: 11px; color: var(--gold-light); display: flex; align-items: center; gap: 6px; }
  .updated-dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }

  .card { background: var(--cream); margin: 20px 16px 0; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); animation: fadeIn 0.4s ease forwards; }
  .card:nth-child(2){animation-delay:0.06s} .card:nth-child(3){animation-delay:0.12s} .card:nth-child(4){animation-delay:0.18s} .card:nth-child(5){animation-delay:0.24s}
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card-header { background: var(--forest-mid); padding: 11px 18px; display: flex; align-items: center; gap: 8px; }
  .card-header-icon { font-size: 15px; }
  .card-header-title { font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--sage); }

  .row-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .info-row { padding: 13px 18px; border-bottom: 1px solid var(--cream-dark); border-right: 1px solid var(--cream-dark); }
  .info-row:nth-child(even) { border-right: none; }
  .info-row.full { grid-column: 1 / -1; border-right: none; }
  .info-label { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-light); margin-bottom: 4px; }
  .info-value { font-size: 14px; font-weight: 500; color: var(--text-dark); line-height: 1.4; }
  .info-value.highlight { color: var(--forest-mid); font-weight: 600; font-size: 16px; }
  .info-value.na { color: var(--text-light); font-style: italic; font-weight: 400; font-size: 13px; }
  .progress-wrap { margin-top: 6px; background: var(--cream-dark); border-radius: 4px; height: 6px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--forest-light), var(--sage)); border-radius: 4px; }

  .bed-image-wrap { margin: 20px 16px 0; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; background: var(--forest-mid); min-height: 180px; display: flex; align-items: center; justify-content: center; }
  .bed-image-wrap img { width: 100%; display: block; object-fit: cover; max-height: 280px; }
  .bed-image-label { position: absolute; bottom: 10px; left: 12px; background: rgba(26,58,42,0.82); color: var(--sage); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
  .no-image { color: var(--sage); font-size: 13px; opacity: 0.6; padding: 40px; text-align: center; }

  .footer { text-align: center; padding: 28px 24px 8px; color: var(--sage); font-size: 11px; opacity: 0.7; letter-spacing: 1px; }

  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
  .loading-leaf { font-size: 40px; animation: spin 1.6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { color: var(--sage); font-size: 14px; letter-spacing: 1px; }

  .error-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; padding: 32px; text-align: center; }
  .error-icon { font-size: 40px; }
  .error-title { color: var(--cream); font-size: 18px; font-weight: 600; }
  .error-msg { color: var(--sage); font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen">
    <div class="loading-leaf">🌿</div>
    <div class="loading-text">Loading bed data…</div>
  </div>
</div>
<script>
// ── CONFIGURATION ── Replace these two values ──────────────────
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE';
// ──────────────────────────────────────────────────────────────

function val(v) {
  if (v === null || v === undefined || v === '') return '<span class="na">Not recorded</span>';
  return v;
}
function fmt(d) {
  if (!d) return '<span class="na">—</span>';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function pct(v) { const n = parseFloat(v); return isNaN(n) ? null : Math.min(100, Math.max(0, n)); }

async function loadBed() {
  const params = new URLSearchParams(window.location.search);
  const bedId = params.get('id');
  if (!bedId) { showError('No Bed ID', 'This QR code does not have a bed ID. Please scan a valid bed QR code.'); return; }
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bed_information_sheet?bed_id=eq.${encodeURIComponent(bedId)}&limit=1`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' } }
    );
    if (!res.ok) throw new Error(`API error ${res.status}`);
    const data = await res.json();
    if (!data || data.length === 0) { showError('Bed Not Found', `Bed <strong>${bedId}</strong> is not registered yet.`); return; }
    renderBed(data[0]);
  } catch(e) {
    showError('Connection Error', 'Could not connect to the database. Please check your internet and try again.');
    console.error(e);
  }
}

function renderBed(b) {
  const sp = pct(b.survival_percentage);
  const now = new Date().toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('app').innerHTML = `
    <div class="page-wrap">
      <div class="header">
        <div class="header-label">Nursery Bed Record</div>
        <div class="header-bed-id">${b.bed_id || 'Unknown'}</div>
        <div class="header-nursery">${b.nursery_name || ''}${b.range ? ' · Range: '+b.range : ''}${b.section ? ' · Section: '+b.section : ''}</div>
        <div class="header-meta">
          ${b.scheme_name ? `<span class="header-badge">${b.scheme_name}</span>` : ''}
          ${b.financial_year ? `<span class="header-badge">FY ${b.financial_year}</span>` : ''}
        </div>
      </div>

      <div class="updated-bar">
        <div class="updated-dot"></div>
        Live data · Fetched ${now}
      </div>

      <div class="card">
        <div class="card-header"><span class="card-header-icon">📍</span><span class="card-header-title">Location</span></div>
        <div class="row-grid">
          <div class="info-row"><div class="info-label">Nursery</div><div class="info-value">${val(b.nursery_name)}</div></div>
          <div class="info-row"><div class="info-label">Beat</div><div class="info-value">${val(b.beat)}</div></div>
          <div class="info-row"><div class="info-label">Range</div><div class="info-value">${val(b.range)}</div></div>
          <div class="info-row"><div class="info-label">Section</div><div class="info-value">${val(b.section)}</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-header-icon">🌱</span><span class="card-header-title">Seed Information</span></div>
        <div class="row-grid">
          <div class="info-row"><div class="info-label">Species</div><div class="info-value highlight">${val(b.species_of_seed)}</div></div>
          <div class="info-row"><div class="info-label">Seed Source</div><div class="info-value">${val(b.source_of_seed)}</div></div>
          <div class="info-row"><div class="info-label">Date of Sowing</div><div class="info-value">${fmt(b.date_of_sowing)}</div></div>
          <div class="info-row"><div class="info-label">Last Shifting</div><div class="info-value">${fmt(b.last_shifting_date)}</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-header-icon">📊</span><span class="card-header-title">Plant Status</span></div>
        <div class="row-grid">
          <div class="info-row"><div class="info-label">Total Plants</div><div class="info-value highlight">${val(b.total_plant_count)}</div></div>
          <div class="info-row"><div class="info-label">Avg Height</div><div class="info-value">${b.average_height_of_plant ? b.average_height_of_plant+' cm' : val(null)}</div></div>
          <div class="info-row full">
            <div class="info-label">Survival Rate</div>
            <div class="info-value highlight">${b.survival_percentage ? b.survival_percentage+'%' : val(null)}</div>
            ${sp !== null ? `<div class="progress-wrap"><div class="progress-bar" style="width:${sp}%"></div></div>` : ''}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-header-icon">🗓️</span><span class="card-header-title">Last Activities</span></div>
        <div class="row-grid">
          <div class="info-row"><div class="info-label">Last Watering</div><div class="info-value">${fmt(b.last_watering_date)}</div></div>
          <div class="info-row"><div class="info-label">Last Grading</div><div class="info-value">${fmt(b.last_grading_date)}</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-header-icon">💊</span><span class="card-header-title">Treatments Applied</span></div>
        <div class="row-grid">
          <div class="info-row"><div class="info-label">Pesticide</div><div class="info-value">${val(b.name_of_pesticide_used)}</div></div>
          <div class="info-row"><div class="info-label">Fertilizer</div><div class="info-value">${val(b.name_of_fertilizer_used)}</div></div>
        </div>
      </div>

      ${b.last_image_of_bed ? `
      <div class="bed-image-wrap">
        <img src="${b.last_image_of_bed}" alt="Bed ${b.bed_id}" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>Image not available</div>'">
        <span class="bed-image-label">Latest Bed Photo</span>
      </div>` : ''}

      <div class="footer">Forest Department · Nursery Management System<br>Data updates automatically on every scan</div>
    </div>
  `;
}

function showError(title, msg) {
  document.getElementById('app').innerHTML = `
    <div class="error-screen">
      <div class="error-icon">🌿</div>
      <div class="error-title">${title}</div>
      <div class="error-msg">${msg}</div>
    </div>`;
}

loadBed();
</script>
</body>
</html>
